<section class="login-page">
  @if (enviado()) {
    <div class="login-card">
      <img class="logo" src="logo-hope.png" alt="Adm Hope" />
      <p class="status">
        Se este e-mail tiver acesso ao sistema, você vai receber em instantes um link para criar uma nova senha.
        Confira também a caixa de spam. O link abre no navegador do celular.
      </p>
      <a routerLink="/login" class="botao botao--primario botao--link">Voltar para o login</a>
    </div>
  } @else {
    <form class="login-card" [formGroup]="form" (ngSubmit)="enviar()">
      <img class="logo" src="logo-hope.png" alt="Adm Hope" />
      <p class="subtitulo">Esqueci minha senha</p>

      @if (erro()) {
        <p class="status status--erro">{{ erro() }}</p>
      }

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" inputmode="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="campo-erro">Informe um email válido.</span>
        }
      </label>

      <button type="submit" class="botao botao--primario" [disabled]="enviando()">
        {{ enviando() ? 'Enviando...' : 'Enviar link' }}
      </button>
      <a routerLink="/login" class="link-voltar">Voltar para o login</a>
    </form>
  }
</section>
