<section class="home-page">
  <header class="topo">
    <img class="logo" src="logo-hope.png" alt="Adm Hope" />
    <button type="button" class="botao-sair" (click)="sair()">Sair</button>
  </header>

  <h1>Equipamentos</h1>
  <p class="subtitulo">O que você quer fazer?</p>

  <nav class="acoes">
    <a routerLink="/equipamentos/alocar" class="cartao-acao">
      <span class="cartao-acao__titulo">Alocar equipamento</span>
      <span class="cartao-acao__descricao">Entregar um equipamento disponível para um colaborador</span>
    </a>

    <a routerLink="/equipamentos/devolver" class="cartao-acao">
      <span class="cartao-acao__titulo">Devolver equipamento</span>
      <span class="cartao-acao__descricao">Encerrar a alocação de um equipamento em uso</span>
    </a>
  </nav>
</section>
