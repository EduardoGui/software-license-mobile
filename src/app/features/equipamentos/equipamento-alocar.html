<section class="acao-page">
  <button type="button" class="voltar" (click)="voltar()">← Voltar</button>
  <h1>Alocar equipamento</h1>

  @if (carregando()) {
    <p class="status">Carregando...</p>
  } @else if (sucesso()) {
    <div class="cartao-sucesso">
      <p class="cartao-sucesso__titulo">Equipamento alocado com sucesso!</p>
      <button type="button" class="botao botao--primario" (click)="alocarOutro()">Alocar outro</button>
      <a routerLink="/home" class="botao botao--texto">Voltar ao início</a>
    </div>
  } @else if (equipamentosDisponiveis().length === 0) {
    <p class="status">Nenhum equipamento disponível no momento.</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="salvar()">
      @if (erro()) {
        <p class="status status--erro">{{ erro() }}</p>
      }

      <label>
        Colaborador *
        <select formControlName="usuarioId">
          <option [ngValue]="0">Selecione...</option>
          @for (usuario of usuarios(); track usuario.id) {
            <option [ngValue]="usuario.id">{{ usuario.nome }}</option>
          }
        </select>
      </label>

      <label>
        Equipamento *
        <select formControlName="equipamentoId">
          <option [ngValue]="0">Selecione...</option>
          @for (equipamento of equipamentosDisponiveis(); track equipamento.id) {
            <option [ngValue]="equipamento.id">{{ descreverEquipamento(equipamento) }}</option>
          }
        </select>
      </label>

      <label>
        Data de início *
        <input type="date" formControlName="dataInicio" />
      </label>

      <label>
        Observação
        <textarea formControlName="observacao" rows="2"></textarea>
      </label>

      <button type="submit" class="botao botao--primario" [disabled]="salvando()">
        {{ salvando() ? 'Alocando...' : 'Alocar equipamento' }}
      </button>
    </form>
  }
</section>
